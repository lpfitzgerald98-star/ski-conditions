# Daily static snapshot for the ski-conditions map, published to GitHub Pages.
#
# The site has no running server -- these flat JSON files under web/data ARE its
# "live" data, rebuilt here and published to Pages. Two things keep this cheap:
#
#   1. The raw-observation DB (data/ski.db, decades of daily history for every
#      station) is CACHED between runs. A warm run fetches only each station's
#      recent tail (see scripts/build_snapshot.py --> pipeline.ingest_mountain),
#      not the whole period of record. A cache miss self-heals with a full pull.
#   2. Every run (cron, push or manual) fetches only each station's recent tail,
#      a few minutes. A push used to skip ingest entirely, which left a mountain
#      moved to a new station blank until the next cron; now the push itself pulls
#      the new station's full history.
#
# Reliability: the Pages publish is retried once (it has hung for 10 minutes on
# GitHub's side), a failed run opens an issue, and site-watchdog.yml re-runs this
# workflow if the published data goes stale.
#
# One-time setup by the repo owner: Settings -> Pages -> Source: "GitHub Actions".
# Manual refresh anytime: Actions tab -> this workflow -> "Run workflow".

name: Ski snapshot

on:
  schedule:
    # Twice daily, OFF the top of the hour (GitHub queues scheduled runs and :00 is
    # its busiest slot). Runs start late: "37 12" landed 16:00-20:15 UTC through
    # Oct-Nov 2026, so the morning slot is set early enough to land around the
    # North American morning, and the evening one refreshes forecasts.
    - cron: "37 7 * * *"
    - cron: "37 19 * * *"
  workflow_dispatch:           # allow manual runs
  push:
    branches: [main]           # rebuild when the site or scoring changes

# contents:write lets the job commit newly-settled history dates back to the repo
# (the retrospective history is immutable + append-only; persisting it means each
# run only computes the few new dates instead of the whole season).
permissions:
  contents: write
  pages: write
  id-token: write
  issues: write          # station-health and failed-build issues

concurrency:
  group: ski-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moved to Ubuntu 26 on 2026-10-19
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install pandas numpy requests anthropic

      # Restore the raw-observation DB from the previous run. Keyed uniquely per
      # run (caches are immutable) with a prefix restore-key, so each run reads
      # the newest ski-db-* cache and writes a fresh one -- the standard pattern
      # for a cache that mutates. A miss (first run, or 7-day eviction) just
      # leaves data/ absent, which the mode step below turns into a full pull.
      - name: Restore observation DB cache
        id: dbcache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: ski-db-${{ github.run_id }}
          restore-keys: |
            ski-db-

      # Put back any forecast_log / quality_log rows the cache doesn't have (a cold
      # cache would otherwise lose the season's prediction history for good --
      # see scripts/sync_logs.py). Idempotent; a no-op on a warm cache.
      - name: Restore prediction logs from the repo
        run: python scripts/sync_logs.py import

      # Decide how much to ingest:
      #   full        - no usable DB (cache miss / first run): pull full history
      #   incremental - warm DB: fetch each station's tail (a station new to the
      #                 DB, e.g. a mountain just moved to it, gets its full history)
      - name: Decide ingest mode
        id: mode
        run: |
          rows=$(python -c "import sqlite3, os; print(sqlite3.connect('data/ski.db').execute('select count(*) from raw_observations').fetchone()[0]) if os.path.exists('data/ski.db') else print(0)" 2>/dev/null || echo 0)
          echo "db rows: $rows"
          if [ "$rows" -eq 0 ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=incremental" >> "$GITHUB_OUTPUT"
          fi

      - name: Build snapshot + retrospective history
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          case "${{ steps.mode.outputs.mode }}" in
            full)  echo "== full ingest (rebuilding DB) =="
                   python scripts/build_snapshot.py --history --full-ingest ;;
            none)  echo "== no ingest (scoring off cached DB) =="
                   python scripts/build_snapshot.py --history --no-ingest ;;
            *)     echo "== incremental ingest (tail only) =="
                   python scripts/build_snapshot.py --history ;;
          esac

      # Station health: list mountains whose station stopped sending snow
      # readings on the run's summary page, and keep GitHub issues in step with
      # it (scripts/station_issues.py: one issue, opened on the first problem,
      # commented when the set changes, closed when all report again; plus one
      # when a station a mountain was moved off returns). Never fails the build.
      - name: Station health
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report="$RUNNER_TEMP/station_health.txt"
          findings="$RUNNER_TEMP/station_health.json"
          python scripts/station_health.py --watch --json "$findings" > "$report" 2>&1 || true
          {
            echo '### Station health'
            echo '```'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$findings" ]; then
            python scripts/station_issues.py "$findings" || echo "Couldn't update station issues"
          fi

      # Save the updated DB back to the cache -- but only when ingest actually
      # ran (a code push scores off it unchanged, so there's nothing new to save).
      - name: Save observation DB cache
        if: steps.mode.outputs.mode != 'none'
        uses: actions/cache/save@v4
        with:
          path: data
          key: ski-db-${{ github.run_id }}

      - name: Persist new history dates + prediction logs
        run: |
          python scripts/sync_logs.py export
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/hist logs
          git diff --cached --quiet || git commit -m "History: new retrospective dates + prediction logs [skip ci]"
          git push || true

      - uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      # GitHub Pages has hung at "updating_pages" until the 10-minute timeout
      # (3 runs on 2026-11-05, status page green) and then published fine on the
      # next try. Retry once from the same artifact; re-running a failed run
      # instead re-uploads and fails on "Multiple artifacts named github-pages".
      - name: Deploy to Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Deploy to Pages (retry)
        id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # One open issue at a time, so a bad stretch doesn't pile up notifications.
      - name: Report a failed build
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Site build failed"
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number -q 'length' || echo 0)
          if [ "$open" = 0 ]; then
            gh issue create --title "$title" --body "The ${{ github.event_name }} build failed: $url. The site keeps serving the last good build until a run succeeds."
          else
            echo "An open '$title' issue already exists; not opening another."
          fi
